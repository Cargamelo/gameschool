<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Village or City? Memory Match</title>
<style>
:root{--bg:#fff7d6;--card:#fff;--ink:#1d2b4f;--sub:#5a6785;--ok:#2e9e4f;--y:#ffd93b;--rc:#43a047;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2036;--card:#262e4d;--ink:#f3f5ff;--sub:#b5bedb}}
:root[data-theme="dark"]{--bg:#1b2036;--card:#262e4d;--ink:#f3f5ff;--sub:#b5bedb}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;font-size:19px;line-height:1.2}
.w{max-width:820px;margin:0 auto;padding:12px}
h1{margin:4px 0 0;text-align:center;font-size:clamp(28px,7vw,46px)}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.tabs span{background:var(--card);border-radius:99px;padding:3px 14px;font-weight:800;font-size:16px;opacity:.55}.tabs .on{opacity:1;background:var(--rc);color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin:4px 4px 8px}
button{font:inherit;font-weight:800;color:var(--ink);cursor:pointer}
.ctl{font-size:20px;background:var(--card);border:3px solid var(--rc);border-radius:14px;padding:4px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.k{perspective:700px;background:none;border:0;padding:0}
.in{position:relative;width:100%;height:136px;transition:transform .45s;transform-style:preserve-3d}
.k.f .in{transform:rotateY(180deg)}
.fr,.bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--rc);text-align:center}
.fr{background:var(--rc);font-size:52px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.bk{background:var(--card);transform:rotateY(180deg);padding:4px 6px}
.bk small{position:absolute;top:4px;left:8px;font-size:15px}
.em{font-size:36px;line-height:1.1}.tx{font-size:16px;font-weight:800;line-height:1.1}
.k.m .bk{background:#e6f7e9;color:#14361a;border-color:var(--ok)}
.cap{min-height:62px;text-align:center;margin:12px 4px;font-weight:800;font-size:20px}
.cap small{display:block;color:var(--sub);font-size:15px;font-weight:600}
.panel{background:var(--card);border-radius:24px;padding:16px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.15);margin:10px 0}
.go{font-size:22px;background:var(--rc);color:#fff;border:0;border-radius:18px;padding:12px 28px;min-height:56px}
.stars{font-size:52px;letter-spacing:5px}
.cf{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
<style id="game-menu-nav-style">
.game-menu-nav{position:sticky;top:0;z-index:9999;display:flex;justify-content:center;align-items:center;width:100%;margin:0;padding:10px 16px;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(20,45,90,.18);box-shadow:0 2px 12px rgba(0,0,0,.09);backdrop-filter:blur(8px)}
.game-menu-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 26px;border:2px solid #fff;border-radius:15px;background:#124b9e;color:#fff;text-decoration:none;font:800 17px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.3px;box-shadow:0 3px 7px rgba(20,45,90,.23)}
.game-menu-nav a:hover{background:#0d3b7f}
.game-menu-nav a:focus-visible{outline:3px solid #f6be30;outline-offset:3px}
@media(max-width:600px){.game-menu-nav{padding:8px 12px}.game-menu-nav a{width:100%;max-width:370px;min-height:48px}}
@media print{.game-menu-nav{display:none!important}}
</style>
</head><body>
<nav class="game-menu-nav" aria-label="Navegación de juegos"><a href="./index.html">🏠 MENÚ PRINCIPAL</a></nav>
<div class="w">
<h1>🏡 Village or City? 🏙️</h1>
<div id="top"></div><div id="board" class="grid"></div><div class="cap" id="cap"></div><div id="end"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const V=[['🛣️','short, narrow streets','calles cortas y estrechas'],['🏠','small buildings','edificios pequeños'],['🛍️','small local shops','tiendas locales pequeñas'],['💼','limited job opportunities','pocas oportunidades de trabajo'],['🏥','shared public services','servicios públicos compartidos'],['🚌','limited public transport','transporte público limitado'],['🚗','very little traffic','muy poco tráfico']];
const C=[['🛣️','long, wide streets','calles largas y anchas'],['🏢','large buildings','edificios grandes'],['🏬','shopping centres and big supermarkets','centros comerciales y supermercados'],['💼','many job opportunities','muchas oportunidades de trabajo'],['🏥','public services','servicios públicos'],['🚇','different types of public transport','distintos tipos de transporte público'],['🚗','a lot of traffic','mucho tráfico']];
const K=[['👨‍👩‍👧','community','comunidad'],['🏡','village','pueblo'],['🏙️','city','ciudad'],['🌾','rural area','zona rural'],['🏢','urban area','zona urbana'],['👥','inhabitants','habitantes']];
let R,ri,st,snd=1,first=null,lock=0,moves=0,left=0,deck=[];
function init(){R=[{n:'Villages',ic:'🏡',c:'#43a047',p:sh(V).slice(0,6),h:'A village is a RURAL area with FEW inhabitants.'},{n:'Cities',ic:'🏙️',c:'#7e57c2',p:sh(C).slice(0,6),h:'Towns and cities are URBAN areas with MANY inhabitants.'},{n:'Key words',ic:'🔑',c:'#e67e22',p:K,h:'Learn the key words of the unit!'}];st=[0,0,0];round(0)}
function say(t){if(!snd)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function round(i){ri=i;const r=R[i];document.documentElement.style.setProperty('--rc',r.c);first=null;lock=0;moves=0;left=r.p.length;
 deck=sh(r.p.flatMap((_,k)=>[{i:k,l:'en'},{i:k,l:'es'}]));
 $('#top').innerHTML=`<div class="tabs">${R.map((x,k)=>`<span class="${k==i?'on':''}">${x.ic} ${x.n} ${'⭐'.repeat(st[k])}</span>`).join('')}</div><div class="bar"><span>Moves: <b id="mv">0</b></span><button class="ctl" id="sd">${snd?'🔊 Sound':'🔇 Sound'}</button></div>`;
 $('#sd').onclick=()=>{snd=!snd;$('#sd').textContent=snd?'🔊 Sound':'🔇 Sound'};
 $('#end').innerHTML='';$('#cap').innerHTML=`${r.h}<small>Find the English card and its Spanish pair. (Encuentra cada frase en inglés y su pareja en español.)</small>`;
 $('#board').innerHTML=deck.map((c,k)=>`<button class="k" data-k="${k}"><div class="in"><div class="fr">${r.ic}</div><div class="bk"><small>${c.l=='en'?'🇬🇧':'🇪🇸'}</small><div class="em">${r.p[c.i][0]}</div><div class="tx">${r.p[c.i][c.l=='en'?1:2]}</div></div></div></button>`).join('');
 document.querySelectorAll('.k').forEach(b=>b.onclick=()=>flip(b))}
function flip(b){const c=deck[+b.dataset.k];if(lock||b.classList.contains('f'))return;b.classList.add('f');
 if(c.l=='en')say(R[ri].p[c.i][1]);
 if(!first){first={b,c};return}
 moves++;$('#mv').textContent=moves;const a=first;first=null;
 if(a.c.i==c.i&&a.c.l!=c.l){[a.b,b].forEach(x=>x.classList.add('m'));const p=R[ri].p[c.i];
  $('#cap').innerHTML=`✅ ${p[0]} ${p[1]} = ${p[2]}<small>Great match! 🎉</small>`;left--;if(!left)setTimeout(done,700)}
 else{lock=1;setTimeout(()=>{a.b.classList.remove('f');b.classList.remove('f');lock=0},1000)}}
function done(){const n=R[ri].p.length,s=moves<=n*1.7?3:moves<=n*2.6?2:1;st[ri]=s;
 $('#top').querySelector('.tabs').children[ri].textContent=`${R[ri].ic} ${R[ri].n} ${'⭐'.repeat(s)}`;
 for(let k=0;k<26;k++){const e=document.createElement('div');e.className='cf';e.textContent=['⭐','🎉','🏡','🏙️'][k%4];e.style.left=Math.random()*95+'vw';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
 const last=ri==R.length-1,T=st.reduce((a,b)=>a+b,0);
 $('#end').innerHTML=`<div class="panel"><div class="stars">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><div style="font-size:26px;font-weight:800">${moves} moves ${s==3?'· Amazing memory! 🧠':s==2?'· Very good! 👏':'· Good job! Try to use fewer moves 💪'}</div>`+
 (last?`<div style="font-size:30px;font-weight:800;margin:10px 0">🏆 All rounds done! ${T} / 9 ⭐<br><small style="font-size:16px;color:var(--sub)">¡Has completado todas las rondas!</small></div><button class="go" onclick="init();scrollTo(0,0)">🔄 Play again (new cards)</button>`:`<button class="go" style="margin-top:10px" onclick="round(${ri+1});scrollTo(0,0)">Next round ➡️</button>`)+'</div>';
 $('#end').scrollIntoView({behavior:'smooth',block:'center'})}
init();
</script></body></html>
