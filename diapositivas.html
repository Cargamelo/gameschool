<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diapositivas de Science · 3.º C</title>
<meta name="description" content="Esquemas de Science: Buenos ciudadanos y Cities and Towns">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#dcecff,#fff7ed);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#172c58}
nav{position:sticky;top:0;z-index:10;text-align:center;padding:10px;background:#fff;box-shadow:0 2px 10px #1a3d7025}
nav a,.back{display:inline-block;padding:10px 23px;border-radius:13px;background:#124b9e;color:white;font-weight:800;text-decoration:none;min-height:46px}
a:focus-visible{outline:3px solid #f6be30;outline-offset:3px}
main{max-width:1600px;margin:auto;padding:22px 14px 50px}
h1{text-align:center;font-size:clamp(1.6rem,4vw,2.8rem);margin:4px 0}p.intro,p.hint{text-align:center;color:#536584;margin:8px auto 20px}
.viewport{overflow-x:auto;padding:5px 2px 16px}
.slides{display:grid;grid-template-columns:repeat(2,minmax(385px,1fr));min-width:790px;gap:20px;align-items:start}
figure{margin:0;padding:15px;border-radius:20px;background:#fff;border:1px solid #d9e5f3;box-shadow:0 7px 24px #17335a1c}
h2{text-align:center;font-size:1.35rem;margin:0 0 14px}
figure img{display:block;width:100%;height:auto;border:1px solid #e3edf7;border-radius:10px}
figure>a{display:block;cursor:zoom-in}
figcaption{text-align:center;margin-top:10px}figcaption a{font-weight:750;color:#124b9e}
.bottom{text-align:center;margin:18px 0}
@media(min-width:850px){.slides{min-width:0;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:849px){.viewport{scroll-snap-type:x proximity}figure{scroll-snap-align:start}}
@media print{nav,.bottom,.hint{display:none}.slides{min-width:0;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}figure{box-shadow:none}}

/* Visor ampliado sobre la misma página */
.zoom-trigger{cursor:zoom-in}
.slide-viewer{width:min(97vw,1600px);max-width:97vw;max-height:96vh;max-height:96dvh;padding:0;border:0;border-radius:17px;background:#fff;color:#172c58;box-shadow:0 15px 65px rgba(0,0,0,.48);overflow:hidden}
.slide-viewer::backdrop{background:rgba(5,17,38,.87)}
.viewer-toolbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:12px 15px 12px 22px;background:#fff;border-bottom:1px solid #d9e5f3}
.viewer-toolbar h2{font-size:clamp(1rem,2.8vw,1.4rem);margin:0;text-align:left;line-height:1.3}
.viewer-close{border:0;background:#bf263a;color:#fff;font:800 25px/1 system-ui,-apple-system,"Segoe UI",sans-serif;width:48px;height:48px;flex:0 0 48px;border-radius:50%;cursor:pointer;touch-action:manipulation}
.viewer-close:hover{background:#942033}
.viewer-close:focus-visible{outline:4px solid #f6be30;outline-offset:2px}
.viewer-frame{display:flex;align-items:center;justify-content:center;overflow:auto;max-height:calc(96vh - 64px);max-height:calc(96dvh - 64px);background:#eff5fc;padding:10px}
.viewer-frame img{display:block;width:auto;height:auto;max-width:100%;max-height:calc(96vh - 85px);max-height:calc(96dvh - 85px);object-fit:contain}
@media(max-width:650px){.slide-viewer{max-width:100vw;width:100vw;max-height:100vh;max-height:100dvh;border-radius:0}.viewer-frame{max-height:calc(100dvh - 64px);padding:5px}.viewer-frame img{max-height:calc(100dvh - 76px)}}
@media print{.slide-viewer{display:none!important}}
</style></head><body>
<nav><a href="./index.html">🏠 MENÚ PRINCIPAL</a></nav>
<main><h1>📑 Diapositivas de Science</h1>
<p class="intro">Los dos esquemas enviados por el profe. Pulsa una imagen para verla más grande.</p>
<div class="viewport" tabindex="0" aria-label="Desplaza horizontalmente para ver las dos diapositivas si no caben en pantalla."><div class="slides">
<figure><h2>🏡 Buenos ciudadanos</h2><a href="./assets/buenos-ciudadanos.jpeg" class="zoom-trigger"><img src="./assets/buenos-ciudadanos.jpeg" width="1600" height="906" alt="Esquema Buenos ciudadanos: en casa, en el colegio y en la comunidad."></a><figcaption><a href="./assets/buenos-ciudadanos.jpeg" class="zoom-trigger">🔍 Ver a tamaño completo</a></figcaption></figure>
<figure><h2>🏙️ Cities and Towns</h2><a href="./assets/cities-towns.jpeg" class="zoom-trigger"><img src="./assets/cities-towns.jpeg" width="1600" height="908" alt="Esquema Cities and Towns: características de las ciudades."></a><figcaption><a href="./assets/cities-towns.jpeg" class="zoom-trigger">🔍 Ver a tamaño completo</a></figcaption></figure>
</div></div><p class="hint">En móvil, desliza hacia los lados para ver ambos esquemas.</p>
<div class="bottom"><a class="back" href="./index.html">🏠 Volver al menú principal</a></div>
</main>
<dialog id="slide-viewer" class="slide-viewer" aria-labelledby="viewer-title">
<div class="viewer-toolbar"><h2 id="viewer-title">Diapositiva</h2><button type="button" class="viewer-close" aria-label="Cerrar diapositiva ampliada" title="Cerrar">✕</button></div>
<div class="viewer-frame"><img id="viewer-image" alt=""></div>
</dialog>
<script>
(function(){
  const dialog=document.getElementById('slide-viewer');
  const picture=document.getElementById('viewer-image');
  const title=document.getElementById('viewer-title');
  const closeButton=dialog.querySelector('.viewer-close');
  let previousTrigger=null;
  document.querySelectorAll('a.zoom-trigger').forEach(function(link){
    link.addEventListener('click',function(event){
      if(typeof dialog.showModal!=='function')return;
      event.preventDefault();
      const heading=link.closest('figure').querySelector('h2');
      const thumbnail=link.closest('figure').querySelector('img');
      previousTrigger=link;
      title.textContent=heading.textContent;
      picture.src=link.getAttribute('href');
      picture.alt=thumbnail.alt;
      dialog.showModal();
      closeButton.focus();
    });
  });
  closeButton.addEventListener('click',function(){dialog.close();});
  dialog.addEventListener('click',function(event){if(event.target===dialog)dialog.close();});
  dialog.addEventListener('close',function(){
    picture.removeAttribute('src');
    if(previousTrigger&&previousTrigger.isConnected)previousTrigger.focus({preventScroll:true});
  });
})();
</script>
</body></html>
